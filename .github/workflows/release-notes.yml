name: Validate Release Notes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Reads the release-note block, applies the matching release-note* label,
      # comments when it is missing or malformed, and fails the check. Same
      # script the release job aggregates with, so the two cannot disagree
      # about what a valid block is.
      - name: Validate release note
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release-notes.py validate \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"
