name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:

  verify-version:
    name: Verify Cargo.toml matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against Cargo.toml version
        # murmur-cli and mur-roost both take `version.workspace = true` from the root
        # Cargo.toml, so pinning one of them to the tag pins the version both assets carry.
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="murmur-cli") | .version')
          echo "Tag version:        ${TAG_VERSION}"
          echo "Cargo.toml version: ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match Cargo.toml version ${CARGO_VERSION}. Bump the workspace version in Cargo.toml to match the tag before releasing."
            exit 1
          fi

  build-macos:
    name: Build macOS (${{ matrix.platform }})
    needs: verify-version
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: darwin-aarch64
          - target: x86_64-apple-darwin
            platform: darwin-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build -p murmur-cli -p mur-roost --release --target ${{ matrix.target }}
      - name: Rename binaries
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          cp target/${{ matrix.target }}/release/mur \
             "mur-${VERSION}-${{ matrix.platform }}"
          cp target/${{ matrix.target }}/release/mur-roost \
             "mur-roost-${VERSION}-${{ matrix.platform }}"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mur-${{ matrix.platform }}
          # Both binaries are release assets. `mur-roost-` carries the version one field
          # later than `mur-`, so a `mur-<version>-*` glob does not match it.
          path: |
            mur-*-${{ matrix.platform }}
            mur-roost-*-${{ matrix.platform }}
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x86_64)
    needs: verify-version
    runs-on: ubuntu-latest
    # A dynamically linked binary requires whatever versioned glibc symbols the glibc
    # that built it offers, so an unpinned build lets the runner's own image decide the
    # floor and whichever image GitHub rolls out next moves it. The `.2.34` suffix on
    # the target is that pin: zig's linker emits version needs against that glibc and no
    # higher, which makes the floor a property of the artifact rather than of wherever
    # the build happened to run. The target is declared in scripts/lib/glibc-floor.sh
    # and this job is checked against that declaration on every pull request, which also
    # refuses a `container:` here — an image would decide the floor a second time.
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        # binutils is what the floor gate reads symbol versions with; libseccomp-dev is
        # what both binaries link against through capsule-runtime.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils libseccomp-dev pkg-config
      - name: Install zig and cargo-zigbuild
        # Pinned by hand rather than through a marketplace action: these two decide the
        # glibc the release links against, so what runs here has to be readable in this
        # file. ZIG_VERSION and CARGO_ZIGBUILD_VERSION move together with the floor.
        env:
          ZIG_VERSION: 0.14.1
          CARGO_ZIGBUILD_VERSION: 0.23.4
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            -o zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version "${CARGO_ZIGBUILD_VERSION}"
      - name: Build
        # zig links against its own bundled glibc headers and stubs, which is what pins the
        # floor -- but it also means its linker does not search the host's multiarch
        # directory, and `-lseccomp` (from capsule-runtime, in both binaries) resolves
        # nowhere without being told where to look. Naming the directory does not let the
        # host's glibc back in: zig resolves libc from its own sysroot, and the version
        # needs the gate reads two steps later are what proves it.
        env:
          RUSTFLAGS: "-L native=/usr/lib/x86_64-linux-gnu"
        run: cargo zigbuild -p murmur-cli -p mur-roost --release --target x86_64-unknown-linux-gnu.2.34
      - name: Rename binaries
        # cargo-zigbuild strips the glibc suffix before handing the target to cargo, so
        # the artifacts land under the unsuffixed triple's directory.
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          cp target/x86_64-unknown-linux-gnu/release/mur \
             "mur-${VERSION}-linux-x86_64"
          cp target/x86_64-unknown-linux-gnu/release/mur-roost \
             "mur-roost-${VERSION}-linux-x86_64"
      - name: Enforce the glibc floor
        # Between the build and the upload, over the assets exactly as they would be
        # published: a build that raises the floor fails here, with no artifact for the
        # release job to attach.
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ./scripts/check-glibc-floor.sh \
            "mur-${VERSION}-linux-x86_64" \
            "mur-roost-${VERSION}-linux-x86_64"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mur-linux-x86_64
          path: |
            mur-*-linux-x86_64
            mur-roost-*-linux-x86_64
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The previous release tag is resolved from the local tag list and
          # the changelog range is walked with `git log`; a shallow checkout
          # carrying only the triggering tag makes both silently wrong.
          fetch-depth: 0
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Compute SHA256 and SHA512 checksums
        id: checksums
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          # Machine-readable SHA256 manifest, published as a release asset and
          # consumed by scripts/install.sh. Standard `sha256sum -c` format, so it
          # can also be verified by hand: sha256sum -c checksums.txt
          sha256sum "mur-${VERSION}-"* "mur-roost-${VERSION}-"* > checksums.txt
          cat checksums.txt

          # SHA256 for release notes
          NOTES="## Checksums\n\`\`\`"
          for f in "mur-${VERSION}-"* "mur-roost-${VERSION}-"*; do
            HASH=$(sha256sum "$f" | awk '{print $1}')
            NOTES="${NOTES}\nsha256  ${f}  ${HASH}"
          done
          NOTES="${NOTES}\n\`\`\`"
          {
            echo "notes<<EOF"
            printf "%b\n" "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # SHA512 for changelog (space-separated to work with shell expansion)
          BINARIES_ARGS=""
          for f in "mur-${VERSION}-"* "mur-roost-${VERSION}-"*; do
            SIZE=$(du -h "$f" | awk '{print $1}')B
            SHA512=$(sha512sum "$f" | awk '{print $1}')
            BINARIES_ARGS="${BINARIES_ARGS} ${f}:${SHA512}:${SIZE}"
          done
          echo "binaries_args=${BINARIES_ARGS}" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"

          # Get previous tag for changelog
          PREVIOUS_TAG=$(git tag --sort=-version:refname --merged HEAD | grep -v "^${{ github.ref_name }}$" | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            # Fail rather than fall back to the current tag. That fallback
            # produced a "Changes since v0.2.0" heading on the v0.2.0 release
            # and an empty range, and looked like a working run.
            echo "::error::Cannot resolve the tag preceding ${VERSION}." \
                 "Tags visible here: $(git tag --list | tr '\n' ' ' | sed 's/ $//')." \
                 "If this is genuinely the first release, pass --previous-version by hand."
            exit 1
          fi

          python .github/scripts/release-notes.py \
            --repo "${{ github.repository }}" \
            aggregate \
            --from "$PREVIOUS_TAG" \
            --to "${{ github.ref_name }}" \
            --version "${VERSION_NO_V}" \
            --binaries ${{ steps.checksums.outputs.binaries_args }} \
            --previous-version "${PREVIOUS_TAG#v}" \
            --output markdown \
            --file "CHANGELOG/v${VERSION_NO_V}.md"
      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ github.ref_name }}
          path: CHANGELOG/${{ github.ref_name }}.md
          retention-days: 30
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"

          # The release body is the generated changelog with the SHA256 block
          # appended. Publishing only the checksums left the release page and
          # the committed CHANGELOG/ file saying different things, and the
          # changelog readable only by whoever downloaded the workflow artifact.
          cat "CHANGELOG/v${VERSION_NO_V}.md" > release-body.md
          printf '\n\n' >> release-body.md
          cat >> release-body.md <<'CHECKSUMS'
          ${{ steps.checksums.outputs.notes }}
          CHECKSUMS

          gh release create "${{ github.ref_name }}" \
            "mur-${VERSION_NO_V}-darwin-aarch64" \
            "mur-${VERSION_NO_V}-darwin-x86_64" \
            "mur-${VERSION_NO_V}-linux-x86_64" \
            "mur-roost-${VERSION_NO_V}-darwin-aarch64" \
            "mur-roost-${VERSION_NO_V}-darwin-x86_64" \
            "mur-roost-${VERSION_NO_V}-linux-x86_64" \
            checksums.txt \
            --repo "${{ github.repository }}" \
            --title "murmur v${VERSION_NO_V}" \
            --notes-file release-body.md
