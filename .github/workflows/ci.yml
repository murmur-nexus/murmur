name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libseccomp
        # Bounded separately from the job: a runner whose Azure mirror is unreachable leaves
        # `apt-get update` failing over for tens of minutes, which reads as a cancelled job with
        # no failing step rather than as the infrastructure hiccup it is.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - name: Check workspace
        run: cargo check --workspace --all-targets

  cargo-test:
    name: cargo-test
    runs-on: ubuntu-latest
    # The ceiling covers the whole job -- compile, link and run -- and is here so a hung test
    # fails the job rather than burning the runner's own limit.
    #
    # About twice the job's median with a warm dependency cache, which also leaves room for a run
    # that misses the cache and rebuilds every dependency at opt-level 2. A single hung test is cut
    # off sooner, by the slow-timeout in .config/nextest.toml's `ci` profile.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Each crate with a `tests/` directory is a separate link unit that statically links wasmtime,
      # so adding one is not free even when its tests are fast. Phase timings for this job are in
      # the step timings: "Build the test binaries" is compile and link, "Run the workspace test
      # suite" is the run.
      - name: CI-only build settings
        # Before rust-cache and before anything builds, so every cargo invocation in the job reads
        # them. What they are and why: .github/cargo-test-ci.toml.
        run: cat .github/cargo-test-ci.toml >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: Swatinem/rust-cache@v2
        with:
          # Dependencies built under other profile settings are no use to this job: restored, they
          # would all be rebuilt on every run and the cache never refreshed.
          key: profile-${{ hashFiles('.github/cargo-test-ci.toml') }}
      - name: Install libseccomp
        # Bounded separately from the job: a runner whose Azure mirror is unreachable leaves
        # `apt-get update` failing over for tens of minutes, which reads as a cancelled job with
        # no failing step rather than as the infrastructure hiccup it is.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - name: Install cargo-nextest
        # A prebuilt binary: building it from source would cost minutes on every run.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Build the test binaries
        # `--features` pulls in `topology_cmd` and `deploy_cmd`, which are `#![cfg(feature = ...)]`
        # files and contribute zero tests without it. The run below passes the same packages and
        # features, so nextest's own build finds everything fresh; a `Compiling` line in its output
        # means the two have drifted apart. `--timings` records each crate's build time.
        run: |
          cargo test --workspace --no-run --timings \
            --features "beta-mur-topology beta-mur-deploy"
      - name: Run the workspace test suite
        # nextest runs the tests of every binary in parallel, each in its own process, rather
        # than one binary after another. The `ci` profile in .config/nextest.toml retries a
        # failure twice and reports a test that then passes as FLAKY, terminates a test still
        # running after five minutes, does not stop at the first failure, and writes the JUnit
        # report the next steps read. The workspace has no doctests, which nextest does not run.
        run: |
          cargo nextest run --profile ci --workspace \
            --features "beta-mur-topology beta-mur-deploy"
      - name: Upload the test report and build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-report
          path: |
            target/nextest/ci/junit.xml
            target/cargo-timings/cargo-timing.html
          if-no-files-found: warn
      - name: Report the tests this runner could not run
        if: always()
        # Runs even when the suite failed, so a red job still says how much of the suite was
        # skipped rather than executed.
        run: |
          report=target/nextest/ci/junit.xml
          if [ ! -f "$report" ]; then
            echo "No test report was written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The JUnit report keeps each test's output, passing or not. The count is of matches,
          # not of lines. `[SKIP-HOST]` never matches the `[SKIP]` pattern -- the `]` is literal --
          # so the two counts stay disjoint.
          host_skips=$(grep -o '\[SKIP-HOST\]' "$report" | wc -l)
          other_skips=$(grep -o '\[SKIP\]' "$report" | wc -l)
          {
            echo "## Tests this runner did not execute"
            echo
            echo "| Skipped for | Tests |"
            echo "| --- | ---: |"
            echo "| Host cannot isolate a capsule (\`[SKIP-HOST]\`) | $host_skips |"
            echo "| A local fixture or checkout this runner does not have (\`[SKIP]\`) | $other_skips |"
            echo
            echo "A capsule that spawns native subprocesses needs both a delegated cgroup v2 scope and"
            echo "its own network namespace. GitHub's runners refuse \`unshare(CLONE_NEWUSER | CLONE_NEWNET)\`"
            echo "under the AppArmor unprivileged-userns restriction, so the launch is refused here."
            echo "Those $host_skips tests are covered by the manual procedure in"
            echo "\`docs/content/reference/resource-limits-manual-verification.md\`, which must be run by"
            echo "hand on a real uncontainerised Linux host."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: cargo-clippy + cargo-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install libseccomp
        # Bounded separately from the job: a runner whose Azure mirror is unreachable leaves
        # `apt-get update` failing over for tens of minutes, which reads as a cancelled job with
        # no failing step rather than as the infrastructure hiccup it is.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        # `--all-features` is not redundant with `--all-targets`: `topology_cmd` and `deploy_cmd`
        # are `#![cfg(feature = ...)]` files and are not linted at all without it.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  wit-versions:
    name: wit-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WIT package versions are single-valued and documented
        run: ./scripts/check-wit-versions.sh

  glibc-floor-binary:
    name: glibc-floor-binary
    runs-on: ubuntu-latest
    # Builds at the same pinned target the release uses and reads the version needs off
    # the resulting ELF, so what runs here is what ships. A source change can raise what
    # the binary requires without touching the floor declaration at all -- which is how a
    # glibc 2.34 symbol reached main under a declared floor of 2.31 -- so nothing that
    # only reads declarations can stand in for this. No --floor override: comparing
    # against anything but the declared floor proves nothing.
    #
    # Merge to main only. A warm-cache rebuild of both binaries at the pinned target
    # measures ~6 minutes on a host faster than this runner, too much to spend on every
    # push to every branch; on main it still fails within minutes of the merge that
    # caused it, where the alternative is finding out at release.
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install libseccomp
        # Bounded separately from the job: a runner whose Azure mirror is unreachable leaves
        # `apt-get update` failing over for tens of minutes, which reads as a cancelled job with
        # no failing step rather than as the infrastructure hiccup it is.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - name: Install zig and cargo-zigbuild
        # Pinned by hand rather than through a marketplace action: these two decide the
        # glibc this build links against, so what runs here has to be readable in this
        # file. Keep both versions in step with .github/workflows/release.yml, which
        # builds the published assets the same way.
        env:
          ZIG_VERSION: 0.14.1
          CARGO_ZIGBUILD_VERSION: 0.23.4
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            -o zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version "${CARGO_ZIGBUILD_VERSION}"
      - name: Build both published binaries at the pinned target
        # zig links against its own bundled glibc headers and stubs, which is what pins the
        # floor -- but it also means its linker does not search the host's multiarch
        # directory, and `-lseccomp` (from capsule-runtime, in both binaries) resolves
        # nowhere without being told where to look. Naming the directory does not let the
        # host's glibc back in: zig resolves libc from its own sysroot, and the version
        # needs the gate reads two steps later are what proves it.
        env:
          RUSTFLAGS: "-L native=/usr/lib/x86_64-linux-gnu"
        run: cargo zigbuild -p murmur-cli -p mur-roost --release --target x86_64-unknown-linux-gnu.2.34
      - name: The built binaries require nothing above the floor
        # cargo-zigbuild strips the glibc suffix before handing the target to cargo, so
        # the binaries land under the unsuffixed triple's directory.
        run: |
          ./scripts/check-glibc-floor.sh \
            target/x86_64-unknown-linux-gnu/release/mur \
            target/x86_64-unknown-linux-gnu/release/mur-roost

  release-notes-cli:
    name: release-notes-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Workflows invoke release-notes.py with arguments it accepts
        # The release workflows are the only callers of that script, and nothing
        # else exercises its command line. When `--repo` moved onto the main
        # parser it became an error *after* the subcommand, which is where all
        # three workflows passed it: `validate` broke on every PR and `aggregate`
        # stayed broken but unnoticed, because it only runs on a release tag.
        # This parses those command lines without running them, so the release
        # job's copy fails here rather than during a release.
        run: python .github/scripts/check-workflow-invocations.py

  macos:
    name: macos (${{ matrix.target }})
    # Compiles every target and every feature at each Apple triple the release publishes, on the
    # runner the release uses. release.yml's build-macos runs only on a release tag, and `cfg`-gated
    # macOS code (a `libc` item Apple does not define, an import unused off Linux) is invisible to
    # every Linux job.
    #
    # The matrix must list every target in release.yml's build-macos matrix.
    # check-release-targets-in-ci.py, run by the release-targets-in-ci job below, fails when it
    # does not, so an Apple target cannot be added to the release without being compiled here.
    #
    # No `if:`: a platform that only breaks at merge is still found after the fact, and the point
    # is to find it on the pull request that breaks it.
    runs-on: macos-latest
    # A ceiling so a hung build or test fails the job rather than burning the runner's own limit.
    timeout-minutes: 60
    strategy:
      # One leg failing says nothing about the other, and both results are wanted.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Check workspace
        # `--all-targets --all-features` for the same reason as `lint`: tests, `mur-alloc-bench`
        # and the feature-gated command files are otherwise never compiled for this platform at
        # all. Warnings are denied because cfg-gated code is exactly where an import or a helper
        # goes unused on one OS only, and no Linux job can see it.
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --all-features --target ${{ matrix.target }}
      - name: Process-identity tests on a Darwin kernel
        # macos-latest is Apple Silicon, so this leg is the native one. The live-session record's
        # start-time token and zombie reading call `proc_pidinfo` directly, and compiling that
        # proves nothing about what the kernel answers.
        if: matrix.target == 'aarch64-apple-darwin'
        # Quoted: a plain scalar ending in `:` reads as a mapping key.
        run: 'cargo test -p capsule-runtime --lib running::'

  release-targets-in-ci:
    name: release-targets-in-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CI compiles every Apple target the release builds
        # Reads the `target:` values of release.yml's build-macos matrix and of the macos job
        # above, and fails when the release builds one this workflow does not compile. It also
        # fails when it cannot find either matrix: a check that finds nothing to compare must not
        # report that nothing differs.
        run: python .github/scripts/check-release-targets-in-ci.py

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check advisories, bans, and licenses
        run: cargo deny check advisories bans licenses
