name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libseccomp
        # Bounded separately from the job: a runner whose Azure mirror is unreachable leaves
        # `apt-get update` failing over for tens of minutes, which reads as a cancelled job with
        # no failing step rather than as the infrastructure hiccup it is.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - name: Check workspace
        run: cargo check --workspace --all-targets

  cargo-test:
    name: cargo-test
    runs-on: ubuntu-latest
    # The ceiling covers the whole job -- compile, link and run -- and is here so a hung test
    # fails the job rather than burning the runner's own limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The job runs at roughly twelve minutes. How that divides between compiling, linking and
      # running the suite has NOT been measured -- an earlier version of this comment asserted a
      # five-minute suite, which was already stale by the time anyone read it, so do not put a
      # number here that nobody re-derived. What would settle it: `finished in Xs` per test binary
      # from the `--nocapture` output below, against a timed `cargo build --workspace --all-targets`.
      # Each crate with a `tests/` directory is a separate link unit that statically links wasmtime,
      # so adding one is not free even when its tests are fast. Four arrived in a single day with
      # the delegation slices, and `capsule-runtime/tests/child_launch.rs` alone runs 42-45s.
      - uses: Swatinem/rust-cache@v2
      - name: Install libseccomp
        # Bounded separately from the job: a runner whose Azure mirror is unreachable leaves
        # `apt-get update` failing over for tens of minutes, which reads as a cancelled job with
        # no failing step rather than as the infrastructure hiccup it is.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - name: Run the workspace test suite
        # `--features` pulls in `topology_cmd` and `deploy_cmd`, which are `#![cfg(feature = ...)]`
        # files and contribute zero tests without it. `--no-fail-fast` keeps one broken suite from
        # hiding the state of every other. `--nocapture` is what lets the summary below see the
        # skip lines at all: cargo swallows a passing test's output otherwise.
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast \
            --features "beta-mur-topology beta-mur-deploy" \
            -- --nocapture 2>&1 | tee test-output.log
      - name: Report the tests this runner could not run
        if: always()
        # Runs even when the suite failed, so a red job still says how much of the suite was
        # skipped rather than executed.
        run: |
          if [ ! -f test-output.log ]; then
            echo "No test output was captured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `--nocapture` interleaves the output of concurrently running tests, so two markers can
          # share a line: the count is of matches, not of lines. `[SKIP-HOST]` never matches the
          # `[SKIP]` pattern -- the `]` is literal -- so the two counts stay disjoint.
          host_skips=$(grep -o '\[SKIP-HOST\]' test-output.log | wc -l)
          other_skips=$(grep -o '\[SKIP\]' test-output.log | wc -l)
          {
            echo "## Tests this runner did not execute"
            echo
            echo "| Skipped for | Tests |"
            echo "| --- | ---: |"
            echo "| Host cannot isolate a capsule (\`[SKIP-HOST]\`) | $host_skips |"
            echo "| A local fixture or checkout this runner does not have (\`[SKIP]\`) | $other_skips |"
            echo
            echo "A capsule that spawns native subprocesses needs both a delegated cgroup v2 scope and"
            echo "its own network namespace. GitHub's runners refuse \`unshare(CLONE_NEWUSER | CLONE_NEWNET)\`"
            echo "under the AppArmor unprivileged-userns restriction, so the launch is refused here."
            echo "Those $host_skips tests are covered by the manual procedure in"
            echo "\`docs/content/reference/resource-limits-manual-verification.md\`, which must be run by"
            echo "hand on a real uncontainerised Linux host."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: cargo-clippy + cargo-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install libseccomp
        # Bounded separately from the job: a runner whose Azure mirror is unreachable leaves
        # `apt-get update` failing over for tens of minutes, which reads as a cancelled job with
        # no failing step rather than as the infrastructure hiccup it is.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        # `--all-features` is not redundant with `--all-targets`: `topology_cmd` and `deploy_cmd`
        # are `#![cfg(feature = ...)]` files and are not linted at all without it.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  wit-versions:
    name: wit-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WIT package versions are single-valued and documented
        run: ./scripts/check-wit-versions.sh

  glibc-floor:
    name: glibc-floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The declared glibc floor matches the release image and what we tell operators
        # Configuration only, so it needs no toolchain and no binary. The release
        # runner's image changing under the build raises the glibc floor silently; this
        # makes that arrive as a failing diff rather than as a published binary half the
        # target distributions cannot exec.
        run: ./scripts/check-glibc-floor.sh --config

  release-notes-cli:
    name: release-notes-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Workflows invoke release-notes.py with arguments it accepts
        # The release workflows are the only callers of that script, and nothing
        # else exercises its command line. When `--repo` moved onto the main
        # parser it became an error *after* the subcommand, which is where all
        # three workflows passed it: `validate` broke on every PR and `aggregate`
        # stayed broken but unnoticed, because it only runs on a release tag.
        # This parses those command lines without running them, so the release
        # job's copy fails here rather than during a release.
        run: python .github/scripts/check-workflow-invocations.py

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check advisories, bans, and licenses
        run: cargo deny check advisories bans licenses
