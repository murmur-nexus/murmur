name: wit-components

# Names the committed WASM components a WIT change has left behind, in a job whose name says so.
# Without it a version bump surfaces as an unrelated test failure ten files away, such as a
# process driver fixture that no longer loads. `cargo test --workspace` runs the same comparison
# (`every_committed_component_matches_the_wit_it_builds_against`), so cargo-test in ci.yml fails
# too; this job is where the failure carries the command that fixes it.
#
# Path-filtered to the WIT tree, and in a workflow of its own because GitHub's `paths` filter
# applies to a whole workflow, not to one job. Only a change under crates/capsule-runtime/wit/
# can make a committed component stale against it.
#
# Not a required check: a path-filtered workflow that does not run leaves a required check
# pending forever, which blocks every pull request that never touches the WIT tree.
on:
  pull_request:
    paths:
      - 'crates/capsule-runtime/wit/**'
  push:
    branches:
      - main
    paths:
      - 'crates/capsule-runtime/wit/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  wit-components:
    name: wit-components
    runs-on: ubuntu-latest
    # Builds committed-components and murmur-artifact only, never wasmtime; a cold cache takes a
    # few minutes, a warm one seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Check mode only. Rebuilding is the bump author's job, on their own machine or a card's
      # worktree, so the author of every committed binary stays a person rather than this
      # runner, whose toolchain is whatever the image ships that day. The check needs no wasm
      # target and no libseccomp.
      - name: Committed components match the WIT they build against
        shell: bash
        run: |
          set -o pipefail
          # The exit status survives the fence and the tee: `&& … ||` keeps -e from leaving the
          # group before the closing fence, and pipefail carries it through `tee`.
          {
            echo '```'
            ./scripts/rebuild-components.sh --check 2>&1 && status=0 || status=$?
            echo '```'
            exit "$status"
          } | tee -a "$GITHUB_STEP_SUMMARY"
