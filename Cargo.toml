[workspace]
members = [
  "crates/murmur-artifact",
  "crates/murmur-cli",
  "crates/capsule-runtime",
  "crates/mur-roost",
  "crates/capsule-runtime/escape-conformance",
  "crates/committed-components",
]
resolver = "2"

[workspace.package]
version = "0.9.0-dev"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/murmur-nexus/murmur"
readme = "README.md"

# Internal crates, version-pinned in one place so `cargo publish` has a concrete
# version to depend on. Bump these in lockstep with `workspace.package.version`.
[workspace.dependencies]
murmur-artifact = { path = "crates/murmur-artifact", version = "0.9.0-dev" }
capsule-runtime = { path = "crates/capsule-runtime", version = "0.9.0-dev" }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

# A warm launch inflates entries out of each artifact's .mur.zip and checks their CRC-32: zip
# reads the entries, flate2 and zlib-rs inflate them and crc32fast checks them, so these four are
# built for speed rather than size.
[profile.release.package.zip]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.zlib-rs]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3
