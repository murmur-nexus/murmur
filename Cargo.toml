[workspace]
members = [
  "crates/murmur-artifact",
  "crates/murmur-cli",
  "crates/capsule-runtime",
  "crates/mur-roost",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/murmur-nexus/murmur"
readme = "README.md"

# Internal crates, version-pinned in one place so `cargo publish` has a concrete
# version to depend on. Bump these in lockstep with `workspace.package.version`.
[workspace.dependencies]
murmur-artifact = { path = "crates/murmur-artifact", version = "0.2.0" }
capsule-runtime = { path = "crates/capsule-runtime", version = "0.2.0" }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
