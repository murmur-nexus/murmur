[advisories]
unmaintained = "all"
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]


[bans]
multiple-versions = "warn"
deny = [
    { crate = "serde_yaml", reason = "deprecated and archived by its author; use serde_norway" },
    { crate = "serde_yml", reason = "RUSTSEC-2025-0068: unsound and unmaintained; use serde_norway" },
]
