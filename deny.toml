[advisories]
unmaintained = "all"
yanked = "warn"
ignore = [
    # serde_yaml's parser; no maintained drop-in exists (serde_yaml_ng uses it too). Remove when
    # manifest parsing moves to a safe-Rust YAML crate such as serde-saphyr.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, not vulnerable; replacing serde_yaml is tracked separately" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]


[bans]
multiple-versions = "warn"
