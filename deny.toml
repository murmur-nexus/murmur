[advisories]
unmaintained = "all"
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]


[bans]
multiple-versions = "warn"
skip = [
    # webpki-roots is a dependency of wasmtime-wasi-http; consider alternatives if licensing becomes critical
    { name = "webpki-roots" },
]
