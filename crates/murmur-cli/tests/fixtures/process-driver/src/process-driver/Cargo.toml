[package]
name = "process-driver-fixture"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

# One source, three components. The feature picks what `describe().interrupt` reports, which is
# what decides the runtime's interrupt path, and `unsupported` also drops the plan's
# `interrupt-stdin`: a driver that cannot interrupt gracefully has no bytes for it.
[features]
default = []
signal-int = []
unsupported = []

[workspace]
