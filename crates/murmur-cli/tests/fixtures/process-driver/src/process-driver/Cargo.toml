[package]
name = "process-driver-fixture"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

# One source, seven components. `signal-int` and `unsupported` pick what `describe().interrupt`
# reports, which is what decides the runtime's interrupt path, and `unsupported` also drops the
# plan's `interrupt-stdin`: a driver that cannot interrupt gracefully has no bytes for it.
# `no-usage` sets `describe().reports-usage` to false and makes `parse` read no `usage` line, so a
# test can drive the runtime's unreporting-driver paths against the same source. `no-login-check`
# makes `describe().login-check` `unavailable`, so a test can drive doctor's "login not checked"
# path. `harness-needs` and `harness-needs-parent` fill `describe().harness-needs` (see the
# README), so a test can drive the runtime's grant of a declared harness need.
[features]
default = []
signal-int = []
unsupported = []
no-usage = []
no-login-check = []
harness-needs = []
harness-needs-parent = []

[workspace]
