[package]
name = "murmur-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The shared artifact model for Murmur capsules: manifest schema, .mur.zip packing and unpacking, the registry trait, refs, lockfile, and inference config."
repository.workspace = true
readme.workspace = true

[dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
url = "2"
wasmparser = { version = "0.251", default-features = false, features = ["std", "component-model"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
wat = "=1.251.0"
