[package]
name = "mur-roost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loopback daemon that referees which Murmur capsules may spawn which other capsules."
repository.workspace = true
readme.workspace = true

[lib]
name = "mur_roost"
path = "src/lib.rs"

[[bin]]
name = "mur-roost"
path = "src/main.rs"

[dependencies]
capsule-runtime.workspace = true
murmur-artifact.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
