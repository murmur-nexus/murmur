[package]
name = "mur-roost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP host daemon that spawns and manages Murmur capsule worker sessions."
repository.workspace = true
readme.workspace = true

[lib]
name = "mur_roost"
path = "src/lib.rs"

[[bin]]
name = "mur-roost"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
capsule-runtime.workspace = true
getrandom = "0.4"
hmac = "0.12"
murmur-artifact.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
