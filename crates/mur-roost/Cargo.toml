[package]
name = "mur-roost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP host daemon that spawns and manages Murmur capsule worker sessions."
repository.workspace = true
readme.workspace = true

[[bin]]
name = "mur-roost"
path = "src/main.rs"

[dependencies]
capsule-runtime.workspace = true
murmur-artifact.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
