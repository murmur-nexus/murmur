# Standalone, hand-run TOCTOU race probes for the seccomp-notify supervisor in
# `crates/capsule-runtime/src/sandbox.rs`. See
# `docs/content/reference/seccomp-notify-toctou-audit.md`.
#
# Deliberately NOT a member of the root workspace (`/Cargo.toml`'s `members` list names exactly
# four crates and this is not one of them). That is the whole mechanism keeping this package out
# of `cargo check --workspace`, `cargo build --workspace` and `cargo test --workspace` — and out
# of CI's `cargo check --workspace --all-targets` — without any `exclude` entry.
#
# The empty `[workspace]` table below is what makes that legal: it declares this directory its own
# workspace root, so cargo does not object to a package living under a workspace directory without
# being a member of it. Removing it makes `cargo build` here fail outright, which is the intended
# tripwire if someone tries to fold this into the workspace.
[workspace]

[package]
name = "seccomp-toctou-racecheck"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hand-run race probes for the capsule-runtime seccomp-notify supervisor's exec/connect TOCTOU"

[[bin]]
name = "connect_race"
path = "src/connect_race.rs"

[[bin]]
name = "exec_race"
path = "src/exec_race.rs"

[lib]
name = "racecheck"
path = "src/lib.rs"

# Same target gating `crates/capsule-runtime/Cargo.toml` uses: `libseccomp` needs a Linux
# `cc`/sysroot and cannot be built on a macOS dev machine at all. Everything under
# `cfg(target_os = "linux")` in this package is therefore hand-reviewed here and compiled only on
# a real Linux host; the non-Linux build is a dependency-free stub that still has to compile.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
libseccomp = "0.4"
