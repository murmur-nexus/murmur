[package]
name = "capsule-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The runtime that executes Murmur capsules. Runs packaged AI agents in isolation, enforcing WASI capability grants on a Wasmtime component sandbox."
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
http = "1"
hyper = { version = "1", default-features = false }
libc = "0.2"
murmur-artifact.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tiktoken-rs = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "macros", "time", "fs", "process"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }
wasmtime = { version = "46", default-features = false, features = [
  "runtime",
  "cranelift",
  "component-model",
  "async",
  "std",
] }
wasmtime-wasi = { version = "46", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "46", features = ["default-send-request"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libseccomp = "0.4"
# Linux-only, and deliberately not in `[dependencies]`: the only thing it is used for is asking
# the systemd user manager for a delegated transient scope over the session bus (see
# `cgroup::move_self_into_own_systemd_scope`), which is meaningless off Linux. `blocking-api` is
# the sync wrapper the cgroup module calls on its own thread; `async-io` is zbus's default
# reactor, kept rather than the `tokio` feature so the call never depends on being inside a
# running tokio runtime.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"
# Dev-only: builds an empty `HyperOutgoingBody` so the hook capability tests can call
# `NetworkPolicyHooks::send_request` directly through a hook store's `WasiHttpView`.
bytes = "1"
http-body-util = "0.1"
# Dev-only: hand-authored WAT component doubles for the hook-instantiation tests
# (required-vs-optional lifecycle export resolution). No production impact.
wat = "=1.251.0"
