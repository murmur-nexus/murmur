# cargo-nextest configuration. CI runs `cargo nextest run --profile ci`; a bare `cargo nextest run`
# uses `default`, which `ci` inherits from.
#
# nextest runs every test in its own process, many at once across all test binaries. A test
# helper that keeps state in a static therefore keeps it per test, not per binary, and anything
# shared must hold across processes: `pinned_port` (capsule-runtime/src/pinned_port.rs) claims
# ports with a lock file per port for that reason.
#
# Doctests are not run by nextest. The workspace has none; if one is added, CI needs a
# `cargo test --doc` step beside the nextest run.

[test-groups]
# Tests that launch a formation hold `launch_lock` (murmur-cli/tests/common/formation.rs), a
# host-wide file lock, for the whole launch. The lock still decides who runs; the group stops
# nextest from starting several of them at once, where all but one would block on the lock, idle
# a test slot each, and spend their slow-timeout waiting.
formation-launch = { max-threads = 1 }

[[profile.default.overrides]]
# Every test that calls `launch_lock()`. A new one left out still serializes on the lock, at the
# cost of a test slot while it waits.
filter = """
binary_id(murmur-cli::formation_launch)
| binary_id(murmur-cli::formation_calls)
| (binary_id(murmur-cli::new_roster)
    & (test(=the_scaffold_installs_and_launches_as_printed)
       | test(=the_scaffolded_lead_hands_the_worker_a_task)))
| (binary_id(murmur-cli::spawner_lifeline_kill)
    & test(=a_formation_member_killed_outright_takes_its_child_with_it))
"""
test-group = "formation-launch"

[profile.ci]
# One failure must not hide the state of the rest of the suite.
fail-fast = false
# A test that fails and then passes is reported FLAKY and does not fail the run; one that fails
# all three attempts does. The JUnit report records every attempt.
retries = 2
# Flagged SLOW after each minute, terminated after five. The slowest test,
# `formation_launch::the_entry_members_end_or_the_launchers_signal_ends_the_formation`, takes under
# three minutes even with unoptimized dependencies on a loaded host. Keep the limit above
# `LAUNCH_LIMIT` (murmur-cli/tests/common/formation.rs) and above `TEST_BUDGET` plus `TERM_GRACE`
# (murmur-cli/tests/browser_in_capsule.rs), so a formation launch that gives up, or a browser run
# past its deadline, fails with its own message rather than being killed first. A test still
# running at the limit is hung, and stopping it lets the rest of the suite finish inside the job's
# timeout.
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"

[profile.ci.junit]
# Written to target/nextest/ci/junit.xml and uploaded by the job. Passing tests' output is kept
# because the job counts the `[SKIP-HOST]` and `[SKIP]` lines in it.
path = "junit.xml"
store-success-output = true

[profile.ci-default-build]
# CI's featureless `murmur-cli` step, which runs after the full run. Inheriting `ci` keeps its
# retries and timeouts; its own name keeps its JUnit report under target/nextest/ci-default-build/,
# so the full run's target/nextest/ci/junit.xml, which the job uploads and counts skips in, survives.
inherits = "ci"

[profile.isolation]
# Run by scripts/isolation-proofs.py, on the host and outside any capsule, for the isolation sets
# in .config/isolation-tests.toml. Retries are 0 because the evidence must show the run that
# happened: a test that failed once and then passed is a failure there, not FLAKY. The runner also
# passes `--retries 0 --no-fail-fast` on the command line, so a card that edits this profile cannot
# loosen either.
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"

[profile.isolation.junit]
# Written to target/nextest/isolation/junit.xml; the runner copies it beside the evidence. Passing
# tests' output is kept because a `[SKIP-HOST]` or `skipping <test>:` line in it makes the test
# no evidence rather than a pass.
path = "junit.xml"
store-success-output = true

# --- Test classes ---------------------------------------------------------------------------
# Every test is in exactly one class, by where it can run (docs/content/contributing/test-classes.md):
#
#   class-capsule    a true result as a command inside a contained Murmur capsule
#   class-isolation  needs kernel isolation an unprivileged user gets on a host prepared like CI's
#                    `contained` job: namespaces, Landlock, seccomp, a delegated cgroup, a real
#                    contained `mur run`
#   class-host       needs the host itself: root, a sysctl or AppArmor change, a browser, egress,
#                    the real home
#
# `cargo nextest run --profile class-<C>` runs one class; `-p` and `-E` on the command line are
# intersected with the profile's `default-filter`. Each profile inherits `ci` (retries,
# slow-timeout, JUnit with passing output) and writes its report to
# target/nextest/class-<C>/junit.xml, so `ci`'s target/nextest/ci/junit.xml is never replaced.
#
# A rule names a test binary. A binary that mixes classes is split by test-name terms only when
# it is large; otherwise it sits whole in the higher class. A new test binary needs a rule here:
# `python3 -I scripts/test-classes.py check`, which CI runs, names any test no profile selects
# or two profiles select. The list these rules produce is .config/test-classes.tsv, written by
# `python3 -I scripts/test-classes.py generate`.

[profile.class-capsule]
inherits = "ci"
default-filter = """
(binary_id(capsule-runtime)
  & not test(/^(agent|artifact|cgroup|containment|detached|errors|guest_worker|host_paths|interpreter_runtime|namespace_probe|network_namespace|plan|race|resources|runtime|sandbox|sealed|session_process|shell|staged_runtime|temp_dir|trace|workdir_writes)::/))
| binary_id(capsule-runtime::child_signal_disposition)
| binary_id(capsule-runtime::closed_stdout)
| binary_id(committed-components)
| binary_id(committed-components::committed_components)
| binary_id(murmur-artifact)
| binary_id(murmur-artifact::docs_links)
| binary_id(mur-roost)
| binary_id(mur-roost::bin/mur-roost)
| binary_id(mur-roost::delegation_bounds)
| binary_id(mur-roost::machine_ceiling)
| binary_id(mur-roost::permission)
| binary_id(mur-roost::registration)
| binary_id(mur-roost::restart_census)
| binary_id(mur-roost::spawn_binding)
| binary_id(mur-roost::spawn_envelope)
| binary_id(mur-roost::version_output)
| (binary_id(murmur-cli::bin/mur)
    & not test(/^(commands::doctor|commands::ps|error)::/))
| binary_id(murmur-cli::build)
| binary_id(murmur-cli::closed_output)
| binary_id(murmur-cli::dev_version_script)
| binary_id(murmur-cli::eval_cmd)
| binary_id(murmur-cli::formation_trace_tasks)
| binary_id(murmur-cli::github_rate_limit)
| binary_id(murmur-cli::host_probe_staging)
| binary_id(murmur-cli::index_cmd)
| binary_id(murmur-cli::install_grant)
| binary_id(murmur-cli::install_lock)
| binary_id(murmur-cli::install_script)
| binary_id(murmur-cli::list_cmd)
| binary_id(murmur-cli::publish_install)
| binary_id(murmur-cli::read_only_scope)
| binary_id(murmur-cli::session_address_any_folder)
| binary_id(murmur-cli::topology_cmd)
| binary_id(murmur-cli::trace_cmd)
| binary_id(murmur-cli::version_cmd)
| binary_id(murmur-cli::wit_contracts)
"""

[profile.class-capsule.junit]
path = "junit.xml"

